name: Dhaka Velocity - Godot Validation

on:
  push:
    branches: [godot-cloud-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, parse and smoke-test game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64

      - name: Import assets and validate scripts
        run: |
          set -o pipefail
          mkdir -p build
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 \
            --headless --editor --path . --quit \
            2>&1 | tee build/godot-validation.log

      - name: Launch game scene for a short smoke test
        run: |
          set -o pipefail
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 \
            --headless --path . --quit-after 120 \
            2>&1 | tee build/godot-smoke-test.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: build/*.log

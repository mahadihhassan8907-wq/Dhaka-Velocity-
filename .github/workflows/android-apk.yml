name: Dhaka Velocity - Android APK Build

on:
  push:
    branches: [godot-cloud-build]
    paths:
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
      - "project.godot"
      - "Main.tscn"
      - "Scripts/**"
      - "Assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Export debug APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot Android SDK dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Download Godot 4.4.1 and Android export templates
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d template-unpack
          cp -a template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android paths and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and export Android APK
        run: |
          set -o pipefail
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 \
            --headless --path . --export-debug "Android" build/DhakaVelocity-debug.apk \
            2>&1 | tee build/android-export.log
          test -s build/DhakaVelocity-debug.apk

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DhakaVelocity-Android-debug
          path: |
            build/DhakaVelocity-debug.apk
            build/android-export.log
